# Balanced full-market scan.
#
# Goal: reduce the bias seen in radar.full_run.yaml where one App Store product
# can dominate the entire run. This config keeps multiple sources enabled and
# uses cross-category discovery instead of hard-coding a single product vertical.
domain_context:
  domain: "broad internet SaaS / SMB operations / indie tools"
  target_user: "solo founders, bootstrapped SaaS builders, and SMB operators"
  hypothesis: ""
  known_competitors: []
  search_keywords: []
  ice_priority:
    impact: 1.0
    confidence: 1.0
    ease: 1.0

sources:
  - type: hackernews
    enabled: true
    tags:
      - ask_hn
      - show_hn
    keywords:
      - saas
      - startup
      - indie
      - bootstrap
      - customers
      - churn
      - billing
      - pricing
      - onboarding
      - subscription
      - b2b
      - frustrated
      - alternative
    min_points: 10

  - type: github_issues
    enabled: true
    mode: product_pain
    repos:
      - supabase/supabase
      - vercel/next.js
      - calcom/cal.com
      - appwrite/appwrite
    pain_keywords:
      - broken
      - confusing
      - slow
      - expensive
      - pricing
      - migration
      - billing
      - onboarding

  - type: producthunt
    enabled: true
    topics: []
    min_votes: 10
    keywords:
      - saas
      - productivity
      - finance
      - accounting
      - developer tools

  - type: reddit
    enabled: true
    subreddits:
      - smallbusiness
      - SaaS
      - indiehackers
      - startups
      - Entrepreneur
    queries:
      - "software alternative frustrating"
      - "saas billing pain"
      - "startup customer acquisition problem"
      - "small business software frustrating"
      - "developer tool pricing too expensive"
      - "project management tool too expensive"
      - "crm migration problem"
      - "email marketing software frustrating"
    sort: new
    time_filter: week
    min_score: 2

  - type: app_store
    enabled: true
    # Keep app_ids empty for broad scans. Use app_ids only in domain-specific
    # configs when the research question names concrete competitors.
    app_ids: []
    search_terms:
      - project management
      - team chat
      - crm
      - invoicing
      - accounting
      - payroll
      - time tracking
      - expense tracker
      - email marketing
      - customer support
      - scheduling
      - password manager
      - cloud storage
      - ai assistant
      - developer tools
    max_stars: 2
    max_pages: 2
    min_points: 10
    keywords: []

filters:
  focus: internet_saas
  language: en
  date_range: last_14_days
  exclude_keywords:
    - lego
    - parenting
    - renewable
    - solar
    - wind power
    - energy transition
    - geopolitics
    - nytimes
    - journalism
    - climate
    - vllm
    - quantization
  quality:
    enabled: true
    drop_product_launches: true
    # Keep Product Hunt launches in this config as launch/market signals.
    # Stage 2/3 should down-rank them unless a real pain signal is present.
    drop_producthunt_launches: false
    drop_job_seeking: true
    drop_celebrations: true
    require_pain_signal_for_show_hn: true
    require_business_pain_for_ask_hn: true
    drop_off_topic_meta_web: true
    fetch_comment_resonance: true
    min_comment_resonance: 0

limit_per_source: 50
top_per_source: 10
