# Stage 0 示例：PDF 文件处理 / 解析 / 自动化
# domain-focus → merge_radar_config.py --base configs/radar.pdf.example.yaml
# 验证 run: pipe_2026-06-07_003 — GitHub PyMuPDF 高信号；HN 避免单独 keyword「form」（易误匹配招聘帖）

domain_context:
  domain: "PDF document processing / parsing / automation"
  target_user: "knowledge workers, ops teams, developers building doc workflows"
  hypothesis: "Reliable merge/OCR/extract is a paid problem when Adobe or OSS tools fail on edge cases"
  known_competitors: ["Adobe Acrobat", "Smallpdf", "ILovePDF", "Docparser", "PDF.co"]
  search_keywords:
    - pdf
    - merge pdf
    - split pdf
    - ocr pdf
    - extract text from pdf
    - pdf parser
    - scanned pdf
    - pdf form
    - pdf to text
    - document parsing
  ice_priority:
    impact: 1.1
    confidence: 1.0
    ease: 1.0

sources:
  - type: hackernews
    enabled: true
    tags:
      - ask_hn
    keywords:
      - pdf
      - ocr
      - document
      - parser
      - extract
      - invoice
      - scanned
      - merge
      - adobe
      - "pdf form"
    min_points: 5

  - type: github_issues
    enabled: true
    mode: product_pain
    repos:
      - pymupdf/PyMuPDF
      - mozilla/pdf.js
    labels: []
    min_comments: 3
    pain_keywords:
      - pdf
      - ocr
      - extract
      - parsing
      - workflow
      - billing
      - onboarding
      - customer
      - form
      - document

  - type: producthunt
    enabled: false

  - type: app_store
    enabled: false
    app_ids: []
    search_terms:
      - pdf reader
      - pdf scanner
    max_stars: 2
    max_pages: 1
    min_points: 10
    keywords: []

  - type: reddit
    enabled: false

filters:
  focus: internet_saas
  language: en
  date_range: last_month
  exclude_keywords:
    - lego
    - parenting
    - vllm
    - quantization
  quality:
    enabled: true
    drop_product_launches: true
    drop_producthunt_launches: true
    drop_job_seeking: true
    drop_celebrations: true
    require_pain_signal_for_show_hn: true
    require_business_pain_for_ask_hn: false
    drop_off_topic_meta_web: true
    fetch_comment_resonance: true
    min_comment_resonance: 0

limit_per_source: 50
top_per_source: 10
