# Stage 0 示例：CI/CD / DevOps 工具链痛点（仍排除纯框架 bug）
# 用法: domain-focus 对话后 merge_radar_config.py --base configs/radar.cicd.example.yaml

domain_context:
  domain: "CI/CD and developer workflow SaaS"
  target_user: "platform engineers and devtool founders"
  hypothesis: "Teams pay for reliable deploy pipelines and DX, not lint rule debates"
  known_competitors: ["GitHub Actions", "CircleCI", "Buildkite"]
  search_keywords:
    - ci/cd
    - deployment
    - pipeline
    - onboarding
    - billing
    - workflow
    - developer experience
    - self-hosted
  ice_priority:
    impact: 1.0
    confidence: 1.1
    ease: 1.0

sources:
  - type: hackernews
    enabled: true
    tags:
      - ask_hn
    keywords:
      - ci/cd
      - deployment
      - devops
      - workflow
    min_points: 8

  - type: github_issues
    enabled: true
    mode: product_pain
    repos:
      - vercel/vercel
      - supabase/supabase
    labels: []
    min_comments: 5
    pain_keywords:
      - onboarding
      - billing
      - pricing
      - customer
      - workflow
      - ux
      - support
      - deployment

  - type: producthunt
    enabled: false

  - type: app_store
    enabled: false

  - type: reddit
    enabled: false

filters:
  focus: internet_saas
  language: en
  date_range: last_month
  exclude_keywords:
    - lego
    - parenting
    - vllm
    - quantization
  quality:
    enabled: true
    drop_product_launches: true
    drop_producthunt_launches: true
    drop_job_seeking: true
    drop_celebrations: true
    require_pain_signal_for_show_hn: true
    require_business_pain_for_ask_hn: true
    drop_off_topic_meta_web: true
    fetch_comment_resonance: true
    min_comment_resonance: 0

limit_per_source: 50
top_per_source: 10
