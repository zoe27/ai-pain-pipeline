# Pain Radar — internet / SaaS product pains (v0.6)
# 质量评估: python3 helpers/eval_radar_quality.py --benchmark benchmarks/radar_quality_pipe_2026-06-06_002.json
# 统一抓取: python3 helpers/fetch_radar.py <pipeline_id> --config configs/radar.example.yaml

domain_context:
  domain: "internet SaaS / indie founders"
  target_user: "solo founders, bootstrapped SaaS builders"
  hypothesis: ""
  known_competitors: []
  search_keywords: []
  ice_priority:
    impact: 1.0
    confidence: 1.0
    ease: 1.0

sources:
  - type: hackernews
    enabled: true
    tags:
      - ask_hn
      - show_hn
    keywords:
      - saas
      - startup
      - indie
      - bootstrap
      - mrr
      - customers
      - churn
      - billing
      - pricing
      - marketing
      - acquisition
      - onboarding
      - subscription
      - b2b
      - frustrated
      - alternative
    min_points: 10

  - type: github_issues
    enabled: false
    mode: product_pain
    repos:
      - supabase/supabase
    labels: []
    min_comments: 10
    pain_keywords:
      - onboarding
      - billing
      - pricing
      - customer
      - workflow
      - ux
      - churn
      - support

  - type: producthunt
    enabled: true
    topics: []
    min_votes: 10
    keywords:
      - saas
      - productivity
      - marketing

  - type: reddit
    enabled: false
    subreddits:
      - SaaS
      - startups
      - Entrepreneur
      - indiehackers
    min_upvotes: 10
    keywords:
      - customers
      - mrr
      - churn
      - marketing

filters:
  focus: internet_saas
  language: en
  date_range: last_7_days
  exclude_keywords:
    - lego
    - parenting
    - renewable
    - solar
    - wind power
    - energy transition
    - geopolitics
    - nytimes
    - journalism
    - climate
    - vllm
    - quantization
  quality:
    enabled: true
    drop_product_launches: true
    drop_producthunt_launches: true
    drop_job_seeking: true
    drop_celebrations: true
    require_pain_signal_for_show_hn: true
    require_business_pain_for_ask_hn: true
    drop_off_topic_meta_web: true
    fetch_comment_resonance: true
    min_comment_resonance: 0

limit_per_source: 50
top_per_source: 10
