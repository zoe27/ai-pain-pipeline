# Pain Radar — internet / SaaS product pains (v0.5)
# 聚焦：线上业务、SaaS、独立开发、获客/留存/变现 —— 非纯技术 bug、非时政/生活杂谈
# 质量评估: python3 helpers/eval_radar_quality.py --benchmark benchmarks/radar_quality_pipe_2026-06-06_002.json
# 统一抓取: python3 helpers/fetch_radar.py <pipeline_id> --config configs/radar.example.yaml

# 领域锚点（可选）：收窄爬取关键词 + Stage 1/2 prompt 上下文
domain_context:
  domain: "internet SaaS / indie founders"
  target_user: "solo founders, bootstrapped SaaS builders"
  hypothesis: ""
  known_competitors: []
  search_keywords: []       # 追加到各源 keywords，如 ["gtm", "cold email"]

sources:
  - type: hackernews
    enabled: true
    tags:
      - ask_hn          # 主战场：创始人/开发者提问
      - show_hn         # 质量过滤会剔除产品发布帖
    keywords:
      - saas
      - startup
      - indie
      - bootstrap
      - mrr
      - customers
      - churn
      - billing
      - pricing
      - marketing
      - acquisition
      - onboarding
      - subscription
      - b2b
      - frustrated
      - alternative
    min_points: 10

  - type: github_issues
    enabled: false
    mode: product_pain
    repos:
      - supabase/supabase
    labels: []
    min_comments: 10
    pain_keywords:
      - onboarding
      - billing
      - pricing
      - customer
      - workflow
      - ux
      - churn
      - support

  - type: producthunt
    enabled: true
    topics: []
    min_votes: 10
    keywords:
      - saas
      - productivity
      - marketing

  - type: reddit
    enabled: false
    subreddits:
      - SaaS
      - startups
      - Entrepreneur
      - indiehackers
    min_upvotes: 10
    keywords:
      - customers
      - mrr
      - churn
      - marketing

filters:
  focus: internet_saas
  language: en
  date_range: last_7_days
  exclude_keywords:
    - lego
    - parenting
    - renewable
    - solar
    - wind power
    - energy transition
    - geopolitics
    - nytimes
    - journalism
    - climate
    - vllm
    - quantization
  quality:
    enabled: true
    drop_product_launches: true       # Show HN 产品发布硬过滤
    drop_producthunt_launches: true   # PH 本质是产品发布，默认全挡
    drop_job_seeking: true
    drop_celebrations: true
    require_pain_signal_for_show_hn: true

limit_per_source: 50
top_per_source: 10
