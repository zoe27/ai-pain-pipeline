# Pain Radar 配置示例
# v0.2: 默认 Hacker News（无需 API key）
# 抓取: python3 helpers/fetch_hn.py <pipeline_id> --config configs/radar.example.yaml
# Reddit（需 OAuth）: python3 helpers/fetch_reddit.py <pipeline_id> --config configs/radar.reddit.example.yaml
# 详见 contracts/pain_point.schema.json + .claude/skills/pain-radar/SKILL.md

sources:
  - type: hackernews
    tags:
      - ask_hn
      - story
      - show_hn
    keywords:
      - saas
      - startup
      - frustrated
      - alternative
      - struggle
    min_points: 10

filters:
  language: en
  date_range: last_7_days   # last_24_hours | last_7_days | last_month

limit_per_source: 50         # 每个 tag 最多抓 50 条（Algolia API）
top_per_source: 10           # 过滤后每 tag 保留条数 → 合并为 top50.json
